site_name: Majmun
site_url: https://mazzz1y.github.io/majmun
repo_url: https://github.com/mazzz1y/majmun
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.instant
    - toc.follow

markdown_extensions:
  - toc:
      anchorlink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Install: install.md
  - Configuration:
      - Overview: config.md
      - Server: config/server.md
      - Logs: config/logs.md
      - Playlists:
          - Overview: config/playlists.md
          - Channels: config/channels.md
      - Playout: config/playout.md
      - EPGs: config/epgs.md
      - Rules:
          - Overview: config/rules/index.md
          - Channel Rules:
              - Set Field: config/rules/channel_rules/set_field.md
              - Remove Field: config/rules/channel_rules/remove_field.md
              - Remove Channel: config/rules/channel_rules/remove_channel.md
              - Mark Hidden: config/rules/channel_rules/mark_hidden.md
          - Playlist Rules:
              - Remove Duplicates: config/rules/playlist_rules/remove_duplicates.md
              - Merge Duplicates: config/rules/playlist_rules/merge_duplicates.md
              - Sort: config/rules/playlist_rules/sort.md
      - Proxy:
          - Overview: config/proxy.md
          - Stream: config/proxy/stream.md
          - Segmenter: config/proxy/segmenter.md
          - Error: config/proxy/error.md
          - HTTP Client: config/proxy/http_client.md
      - Clients: config/clients.md
      - URL Generator: config/url_generator.md
      - Shared:
          - Command: config/shared/command.md
          - Condition: config/shared/condition.md
          - Selector: config/shared/selector.md
          - Final Value: config/shared/final_value.md
          - Duration: config/shared/duration.md
          - Name/Value: config/shared/name-value.md
  - Examples:
      - Overview: examples/index.md
      - Minimal: examples/minimal.md
      - Proxy: examples/proxy.md
      - Playout: examples/playout.md
      - Rules: examples/rules.md
      - Full Setup: examples/full.md
  - Metrics: metrics.md
